apiVersion: data.fluid.io/v1alpha1
kind: CacheRuntimeClass
metadata:
  name: curvine-demo
fileSystemType: curvinefs
dataOperationSpecs:
  - name: DataLoad
    command:
      - "/bin/bash"
      - "-c"
    args:
      - |
        CURVINE_HOME="/app/curvine"
        CURVINE_CONF_DIR="/conf"
        CURVINE_DATA_DIR="/data"
        CURVINE_LOG_DIR="/logs"
        
        mkdir -p ""
        mkdir -p ""
        mkdir -p ""
        
        python3 "/generate_config.py" || {
          echo "Error: generate_config.py failed."
          exit 1
        }
        
        export CURVINE_CONF_FILE="/curvine-cluster.toml"
        
        IFS=: read -ra paths <<< ""
        for p in ""; do
          "/bin/cv" load "" --watch --conf "" || {
            echo "Error: load  failed."
            exit 1
          }
        done
topology:
  master:
    service:
      headless: {}
    executionEntries:
      mountUFS:
        command:
          - bash
          - -c
          - /app/curvine/mountUfs.sh
        timeout: 120
      reportSummary:
        command:
          - bash
          - -c
          - /app/curvine/reportSummary.sh
        timeout: 30
    template:
      spec:
        restartPolicy: Always
        containers:
          - name: master
            image: curvine/curvine:0.3.6-alpha
            command:
              - /entrypoint.sh
            args:
              - master
              - start
            imagePullPolicy: IfNotPresent
            readinessProbe:
              tcpSocket:
                port: 8995
              initialDelaySeconds: 35
              periodSeconds: 5
              failureThreshold: 12
            env:
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
  worker:
    service:
      headless: {}
    template:
      spec:
        restartPolicy: Always
        containers:
          - name: worker
            image: curvine/curvine:0.3.6-alpha
            command:
              - /entrypoint.sh
            args:
              - worker
              - start
            imagePullPolicy: IfNotPresent
            readinessProbe:
              tcpSocket:
                port: 8997
              initialDelaySeconds: 5
              periodSeconds: 5
              failureThreshold: 12
            env:
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
  client:
    template:
      spec:
        restartPolicy: Always
        containers:
          - name: client
            image: curvine/curvine:0.3.6-alpha
            command:
              - /entrypoint.sh
            args:
              - client
              - start
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
              runAsUser: 0
            lifecycle:
              preStop:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - |
                      echo "PreStop: Cleaning up FUSE mount..."
                      target_path=""
                      if [ -n "" ] && mountpoint -q "" 2>/dev/null; then
                        fusermount -u "" 2>/dev/null || umount -f "" 2>/dev/null || true
                      else
                        echo "Mount point  is not mounted, skipping"
                      fi
                      echo "PreStop: Cleanup completed"

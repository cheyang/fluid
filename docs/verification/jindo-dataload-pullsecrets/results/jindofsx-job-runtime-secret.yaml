---
# Source: fluid-dataloader/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-release-data-load-script
  labels:
    release: test-release
    role: dataload-job
    app.kubernetes.io/name: fluid-dataloader
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/managed-by: Helm
    fluid.io/managed-by: fluid
    fluid.io/dataset-id: fluid-test-dataset
data:
  dataloader.jindo.init: |
    #!/usr/bin/env bash
    set -xe
    jindo_env_vars=(
      STORAGE_ADDRESS
    )
    function public::jindo::init_conf() {
      for key in "${jindo_env_vars[@]}"; do
        if [[ -v $key ]]; then
          export ${key}=\"${!key}\"
        fi
      done
    }
    main() {
      public::jindo::init_conf
    }
    main
  dataloader.distributedLoad: |
    #!/usr/bin/env bash
    set -xe
    
    function checkPathExistence() {
        local targetPath=$1
        local checkPathResult=$(timeout 30s hadoop fs -ls jindo://$targetPath |& tail -3)
        local strUnexistence="No such file or directory"
        if [[ $checkPathResult =~ $strUnexistence ]];then
            echo -e "dataLoad failed because some paths not exist."
            exit 1
        fi
    }

    function distributedLoad() {
        local path=$1
        local replica=$2
        local default=$3
        local cmd="jindo fs -load"
        checkPathExistence "$path"
        if [[ $needLoadMetadata == 'true' ]]; then
            echo -e "--- enable metaCache"
            cmd="$cmd -meta"
            echo -e "now cmd $cmd"
        else
            echo -e "--- disable metaCache"
        fi

        if [[ $loadMetadataOnly == 'true' ]]; then
            echo -e "--- disable datacache"
        else
           echo -e "--- enable datacache"
           cmd="$cmd -data"
           echo -e "now cmd $cmd"
        fi

        if [[ $atomicCache == 'true' ]]; then
            echo -e "--- enable atomicCache"
            cmd="$cmd -atomic"
            echo -e "now cmd $cmd"
        else
            echo -e "--- disable atomicCache"
        fi

        if [[ $loadMemorydata == 'true' ]]; then
            echo -e "--- enable loadMemorydata"
            cmd="$cmd -m"
            echo -e "now cmd $cmd"
        else
            echo -e "--- disable loadMemorydata"
        fi
    
        if [[ $enableDryrun == 'true' ]]; then
            echo -e "--- enable dryrun"
            cmd="$cmd -dryrun"
            echo -e "now cmd $cmd"
        else
            echo -e "--- disable dryrun"
        fi

        if [[ $enbaleCacheListLocation == 'true' ]]; then
            if [[ -e "ossutil64" ]]; then
                echo "Found ossutil64 executable file under /"
            else
                echo -e "--- begin download ossutil"
                apt-get update && apt-get install wget -y
                wget http://gosspublic.alicdn.com/ossutil/1.7.5/ossutil64 && chmod 755 ossutil64
            fi
            ./ossutil64 -e $cacheListEndpoint -i $cacheListAccessKeyId -k $cacheListAccessKeySecret cp $cacheListUrl /cachelist.txt
            echo -e "--- enable File List"
            cmd="$cmd -R -replica $cacheListReplica -cachelist /cachelist.txt -thread $cacheListThread $default/"
            echo -e "execute cmd $cmd"
            time $cmd
        elif [[ $enableFilter == 'true' ]]; then
            cmd="$cmd -s -R -replica $replica -filter $cacheFilter -thread $cacheListThread $default$path"
            echo -e "execute cmd $cmd"
            time $cmd
        else
            cmd="$cmd -s -R -replica $replica $default$path"
            echo -e "execute cmd $cmd"
            time $cmd
        fi

        #echo -e "distributedLoad and sleep start now"
        #sleep 10m
    }

    function main() {
        needLoadMetadata="$NEED_LOAD_METADATA"
        loadMemorydata="$LOAD_MEMORY_DATA"
        loadMetadataOnly="$LOAD_METADATA_ONLY"
        atomicCache="$ENABLE_ATOMIC_CACHE"
        cacheListReplica=$CACHE_LIST_REPLICA
        cacheListThread=$CACHE_LIST_THREAD
        enbaleCacheListLocation=$Enable_CACHE_LIST_LOCATION
        cacheListAccessKeyId=$CACHE_LIST_ACCESSKEYID
        cacheListAccessKeySecret=$CACHE_LIST_ACCESSKEYSECRET
        cacheListEndpoint=$CACHE_LIST_ENDPOINT
        cacheListUrl=$CACHE_LIST_URL
        cacheFilter=$CACHE_FILTER
        enableFilter=false
        enableDryrun=$DRY_RUN_ENABLE
        #judge whether to use locaion list
        if [[ -z "$cacheListAccessKeyId" ]] || [[ -z "$cacheListAccessKeySecret" ]] || [[ -z "$cacheListEndpoint" ]] || [[ -z "$cacheListUrl" ]]; then
            enbaleCacheListLocation=false
        else
            enbaleCacheListLocation=true
        fi
        if [[ -z "$cacheListReplica" ]]; then
            cacheListReplica=1
        else
            echo -e "cacheListReplica $cacheListReplica"
        fi
        if [[ -z "$cacheListThread" ]]; then
            cacheListThread=10
        else
            echo -e "cacheListThread $cacheListThread"
        fi
        if [[ -z "$cacheFilter" ]]; then
            enableFilter=false
        else
            enableFilter=true
            echo -e "enableFilter $enableFilter"
        fi
        dafault="jindo://"
        paths="$DATA_PATH"
        paths=(${paths//:/ })
        replicas="$PATH_REPLICAS"
        replicas=(${replicas//:/ })
        for((i=0;i<${#paths[@]};i++)) do
            local path="${paths[i]}"
            local replica="${replicas[i]}"
            echo -e "distributedLoad on $path starts"
            distributedLoad ${paths[i]} ${replicas[i]} ${dafault}
            #echo -e "distributedLoad on $path ends"
        done
    }

    main "$@"
---
# Source: fluid-dataloader/templates/job.yaml
# .Release.Name will be used to decide which dataset will be preload
# .Release.Name should be like `<pvc-name>-load`(e.g. hbase-load for a PersistentVolumeClaim named `hbase`)
# TODO: the length of .Release.Name won't exceed 53(limited by Helm), which means length of `<pvc-name>` can't exceed 48. This might be a problem.
  
  
  
  
  
  
  
  
  
apiVersion: batch/v1
kind: Job
metadata:
  name: test-release-job
  labels:
    release: test-release
    role: dataload-job
    app: jindofsx
    targetDataset: test-dataset
    app.kubernetes.io/name: fluid-dataloader
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/managed-by: Helm
    fluid.io/managed-by: fluid
    fluid.io/dataset-id: fluid-test-dataset
  ownerReferences:
    - apiVersion: data.fluid.io/v1alpha1
      blockOwnerDeletion: false
      controller: true
      kind: DataLoad
      name: test-dataload
      uid: 
spec:
  backoffLimit: 1
  completions: 1
  parallelism: 1
  template:
    metadata:
      name: test-release-loader
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        release: test-release
        role: dataload-pod
        app: jindofsx
        targetDataset: test-dataset
        app.kubernetes.io/name: fluid-dataloader
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/managed-by: Helm
        fluid.io/managed-by: fluid
        fluid.io/dataset-id: fluid-test-dataset
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: runtime-secret
      containers:
        - name: dataloader
          image: fluid:v0.0.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["/scripts/jindo_env_init.sh && /scripts/jindo_dataload.sh"]  
          env:
            - name: STORAGE_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NEED_LOAD_METADATA
              value: "false"
            - name: LOAD_MEMORY_DATA
              value: "false"
            - name: DATA_PATH
              value: "/"
            - name: PATH_REPLICAS
              value: "1"
          envFrom:
            - configMapRef:
                name: test-dataset-jindofs-client-config
          volumeMounts:
            - name: bigboot-config
              mountPath: /jindosdk.cfg
              subPath: jindosdk.cfg
            - name: bigboot-config
              mountPath: /hdfs-3.2.1/etc/hadoop/core-site.xml
              subPath: core-site.xml
            - mountPath: /scripts
              name: data-load-script
      volumes:
        - name: bigboot-config
          configMap:
            name: test-dataset-jindofs-config
        - name: data-load-script
          configMap:
            name: test-release-data-load-script
            items:
              - key: dataloader.jindo.init
                path: jindo_env_init.sh
                mode: 365
              - key: dataloader.distributedLoad
                path: jindo_dataload.sh
                mode: 365
---

---
# Source: fluid-dataloader/templates/cronjob.yaml
apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: test-release-job
  labels:
    release: test-release
    role: dataload-cronjob
    app: cache
    targetDataset: test-dataset
    dataload: test-dataload
    fluid.io/jobPolicy: cron
    app.kubernetes.io/name: fluid-dataloader
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/managed-by: Helm
    fluid.io/managed-by: fluid
    fluid.io/dataset-id: fluid-test-dataset
  ownerReferences:
    - apiVersion: data.fluid.io/v1alpha1
      blockOwnerDeletion: false
      controller: true
      kind: DataLoad
      name: test-dataload
      uid: 
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 3
      completions: 1
      parallelism: 1
      template:
        metadata:
          name: test-release-loader
          annotations:
            sidecar.istio.io/inject: "false"
          labels:
            release: test-release
            role: dataload-pod
            app: cache
            cronjob: test-release-job
            targetDataset: test-dataset
            app.kubernetes.io/name: fluid-dataloader
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/managed-by: Helm
            fluid.io/managed-by: fluid
            fluid.io/dataset-id: fluid-test-dataset
        spec:
          
          restartPolicy: Never
          imagePullSecrets:
            - name: runtime-secret
          containers:
            - name: dataloader
              image: fluid:v0.0.1
              imagePullPolicy: IfNotPresent
              command:
              args:
              env:
                - name: FLUID_DATALOAD_METADATA
                  value: "false"
                - name: FLUID_DATALOAD_DATA_PATH
                  value: "/"
                - name: FLUID_DATALOAD_PATH_REPLICAS
                  value: "1"
